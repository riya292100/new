spring:
  application:
    name: quickcart-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

server:
  port: ${PORT:8081}

quickcart:
  app:
    jwtSecret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    jwtExpirationMs: ${JWT_EXPIRATION_MS:86400000} # 24 hours
    jwtRefreshExpirationMs: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
    deliveryRadiusKm: 15.0
    freeDeliveryThreshold: 199.0
    baseDeliveryFee: 25.0
    platformFee: 5.0
    taxRate: 0.05
    cashbackPercentage: 5.0
    welcomeBonusAmount: 100.0
    payment:
      provider: ${PAYMENT_PROVIDER:mock_razorpay}
      keyId: ${RAZORPAY_KEY_ID:rzp_test_quickcartKey2026}
      keySecret: ${RAZORPAY_KEY_SECRET:rzp_secret_quickcartSecret2026}
      webhookSecret: ${RAZORPAY_WEBHOOK_SECRET:quickcart_webhook_secret_2026}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
