spring:
  application:
    name: quickcart-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  threads:
    virtual:
      enabled: true # Java 21 Project Loom Virtual Threads for ultra-high concurrency
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: quickcart-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.quickcart.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: ${PORT:8081}

quickcart:
  app:
    jwtSecret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    jwtExpirationMs: ${JWT_EXPIRATION_MS:86400000} # 24 hours
    jwtRefreshExpirationMs: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
    deliveryRadiusKm: 15.0
    freeDeliveryThreshold: 199.0
    baseDeliveryFee: 25.0
    platformFee: 5.0
    taxRate: 0.05
    cashbackPercentage: 5.0
    welcomeBonusAmount: 100.0
    payment:
      provider: ${PAYMENT_PROVIDER:mock_razorpay}
      keyId: ${RAZORPAY_KEY_ID:rzp_test_quickcartKey2026}
      keySecret: ${RAZORPAY_KEY_SECRET:rzp_secret_quickcartSecret2026}
      webhookSecret: ${RAZORPAY_WEBHOOK_SECRET:quickcart_webhook_secret_2026}
  demo:
    admin-password: ${DEMO_ADMIN_PASSWORD:${QUICKCART_DEMO_ADMIN_PASSWORD:}}
    driver-password: ${DEMO_DRIVER_PASSWORD:${QUICKCART_DEMO_DRIVER_PASSWORD:}}
    customer-password: ${DEMO_CUSTOMER_PASSWORD:${QUICKCART_DEMO_CUSTOMER_PASSWORD:}}
    seeding-enabled: ${QUICKCART_SEEDING_ENABLED:true}
  events:
    kafkaEnabled: ${KAFKA_ENABLED:false}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true

resilience4j:
  circuitbreaker:
    instances:
      paymentGateway:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  ratelimiter:
    instances:
      orderApi:
        limit-for-period: 30
        limit-refresh-period: 1s
        timeout-duration: 500ms

