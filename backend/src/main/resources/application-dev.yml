spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:quickcart_dev_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL}
    driverClassName: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: false # H2 dev mode uses JPA ddl-auto for instant local startup
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
  cache:
    type: ${CACHE_TYPE:none} # in local standalone dev, defaults to none unless Redis is running

management:
  health:
    redis:
      enabled: false # Redis not required in local dev; exclude from health aggregate

quickcart:
  demo:
    admin-password: ${DEMO_ADMIN_PASSWORD:${QUICKCART_DEMO_ADMIN_PASSWORD:Admin@123}}
    driver-password: ${DEMO_DRIVER_PASSWORD:${QUICKCART_DEMO_DRIVER_PASSWORD:Driver@123}}
    customer-password: ${DEMO_CUSTOMER_PASSWORD:${QUICKCART_DEMO_CUSTOMER_PASSWORD:Customer@123}}
