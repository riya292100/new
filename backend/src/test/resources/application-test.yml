spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  datasource:
    url: jdbc:h2:mem:quickcart_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: false
  flyway:
    enabled: false
  cache:
    type: none

quickcart:
  app:
    jwtSecret: dGVzdFNlY3JldEtleUZvclF1aWNrQ2FydEFwcGxpY2F0aW9uTG9uZ0Vub3VnaFRvQmVTZWN1cmUyMDI2
    jwtExpirationMs: 86400000
    jwtRefreshExpirationMs: 604800000
    freeDeliveryThreshold: 199.0
    baseDeliveryFee: 25.0
    platformFee: 5.0
    taxRate: 0.05
    cashbackPercentage: 5.0
    welcomeBonusAmount: 100.0

management:
  health:
    redis:
      enabled: false
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
