name: 🐛 Bug Report
description: Report a bug or unexpected behavior in QuickCart.
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much context as possible.

  - type: dropdown
    id: component
    attributes:
      label: Component Affected
      description: Which part of QuickCart is experiencing the issue?
      options:
        - Frontend Storefront (React/Vite)
        - Backend Core API (Spring Boot)
        - Dark Store Geo-Fulfillment Engine
        - Inventory Locking & Concurrency
        - Double-Entry Financial Ledger
        - Database & Flyway Migrations
        - Docker Compose Stack
        - CI/CD & Workflows
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: What went wrong?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Start the application with `...`
        2. Navigate to `...`
        3. Click on `...`
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment Info
      description: OS, Java version, Node version, Browser, etc.
      placeholder: |
        - OS: Windows 11 / Ubuntu 22.04 / macOS
        - Java: OpenJDK 21
        - Node.js: v22.x
        - Browser: Chrome 124
    validations:
      required: false
