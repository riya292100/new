name: Release & Changelog Publisher

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: './backend/pom.xml'

      - name: Build Backend JAR
        working-directory: ./backend
        run: |
          chmod +x ./mvnw
          if [ -f "./mvnw" ]; then
            ./mvnw -B clean package -DskipTests
          else
            mvn -B clean package -DskipTests
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Build Frontend Distribution
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      - name: Create Release Archive
        run: |
          tar -czf quickcart-frontend-dist.tar.gz -C frontend/dist .
          cp backend/target/quickcart-backend-*.jar quickcart-backend.jar

      - name: Generate GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: QuickCart Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            quickcart-backend.jar
            quickcart-frontend-dist.tar.gz
