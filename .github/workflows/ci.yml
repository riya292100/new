name: QuickCart CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Frontend Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Verify Formatting (Prettier)
        working-directory: ./frontend
        run: npm run format:check

      - name: Run Linter (ESLint)
        working-directory: ./frontend
        run: npm run lint

      - name: Run Typecheck
        working-directory: ./frontend
        run: npm run typecheck

      - name: Security Dependency Audit
        working-directory: ./frontend
        run: npm audit --audit-level=high

  frontend-ci:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    needs: [ lint-and-format ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Tests (Vitest)
        working-directory: ./frontend
        run: npm run test

      - name: Run Coverage Check
        working-directory: ./frontend
        run: npm run coverage

      - name: Build Production Assets
        working-directory: ./frontend
        run: npm run build

  backend-ci:
    name: Backend Tests & Build (Standalone H2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: './backend/pom.xml'

      - name: Make Maven Wrapper Executable
        run: chmod +x ./backend/mvnw || true

      - name: Run Backend Tests (JUnit 5)
        working-directory: ./backend
        run: |
          if [ -f "./mvnw" ]; then
            ./mvnw -B clean test -Dspring.profiles.active=test
          else
            mvn -B clean test -Dspring.profiles.active=test
          fi

      - name: Package Standalone Production JAR
        working-directory: ./backend
        run: |
          if [ -f "./mvnw" ]; then
            ./mvnw -B package -DskipTests
          else
            mvn -B package -DskipTests
          fi

  docker-ci:
    name: Docker Stack Build Validation
    runs-on: ubuntu-latest
    needs: [ frontend-ci, backend-ci ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Fullstack Docker Stack
        run: docker compose build
