name: QuickCart CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-ci:
    name: Frontend Tests, Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Verify Formatting (Prettier)
        working-directory: ./frontend
        run: npm run format:check

      - name: Lint (ESLint)
        working-directory: ./frontend
        run: npm run lint

      - name: Type Check
        working-directory: ./frontend
        run: npm run typecheck

      - name: Run Tests (Vitest)
        working-directory: ./frontend
        run: npm run test

      - name: Run Coverage Check (Vitest Threshold Gate)
        working-directory: ./frontend
        run: npm run coverage

      - name: Build Production Assets
        working-directory: ./frontend
        run: npm run build

      - name: Security Dependency Audit
        working-directory: ./frontend
        run: npm audit --audit-level=high

  backend-ci:
    name: Backend Tests & Build (Standalone H2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: './backend/pom.xml'

      - name: Make Maven Wrapper Executable
        run: chmod +x ./backend/mvnw

      - name: Run Backend Checkstyle Lint
        working-directory: ./backend
        run: mvn -B checkstyle:check

      - name: Run Backend Tests (JUnit 5 & JaCoCo)
        working-directory: ./backend
        run: |
          mvn -B test -Dspring.profiles.active=test || {
            echo "=== SUREFIRE REPORTS ==="
            cat target/surefire-reports/*.txt 2>/dev/null
            exit 1
          }

      - name: Package Standalone Production JAR
        working-directory: ./backend
        run: mvn -B package -DskipTests

  python-ci:
    name: Python AI Demand Engine & Data Quality Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'services/ai-demand-engine/requirements.lock'

      - name: Install AI Engine Dependencies
        working-directory: ./services/ai-demand-engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock pytest pytest-cov

      - name: Run Python AI & Data Quality Pytest Suite
        working-directory: ./services/ai-demand-engine
        run: python -m pytest -v --cov=app --cov-report=term-missing

      - name: Install Data Pipeline Dependencies
        working-directory: ./services/data-pipeline
        run: pip install -r requirements.lock pytest

      - name: Run Data Pipeline & Orchestrator Tests
        working-directory: ./services/data-pipeline
        run: python -m pytest tests -v

  lint-sql:
    name: SQL Lint (SQLFluff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install SQLFluff
        run: pip install sqlfluff==4.3.0

      - name: Run SQL Linter
        run: npm run lint:sql

  go-ci:
    name: Go Spatial Telemetry Service (go test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: 'services/telemetry-service/go.mod'

      - name: Run Go Unit Tests
        working-directory: ./services/telemetry-service
        run: go test -v -race ./...

      - name: Run Go Vet
        working-directory: ./services/telemetry-service
        run: go vet ./...

      - name: Build Go Binary
        working-directory: ./services/telemetry-service
        run: CGO_ENABLED=0 go build -v -o telemetry-server main.go

  rust-ci:
    name: Rust Flash Sale Engine (cargo test + clippy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            services/flash-sale-engine/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('services/flash-sale-engine/Cargo.lock') }}

      - name: Verify Formatting (cargo fmt)
        working-directory: ./services/flash-sale-engine
        run: cargo fmt --check

      - name: Run Rust Unit & Concurrency Tests
        working-directory: ./services/flash-sale-engine
        run: cargo test --verbose

      - name: Run Cargo Clippy (Lint)
        working-directory: ./services/flash-sale-engine
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check Rust Compilation
        working-directory: ./services/flash-sale-engine
        run: cargo check --verbose

  docker-ci:
    name: Docker Stack Build Validation
    runs-on: ubuntu-latest
    needs: [ frontend-ci, backend-ci, python-ci, go-ci, rust-ci, lint-sql ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Config
        run: docker compose config

      - name: Build Fullstack Polyglot Docker Stack
        run: docker compose build --progress=plain
