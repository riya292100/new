name: QuickCart CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Frontend Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Verify Formatting (Prettier)
        working-directory: ./frontend
        run: npm run format:check

      - name: Lint (ESLint)
        working-directory: ./frontend
        run: npm run lint

      - name: Typecheck
        working-directory: ./frontend
        run: npm run typecheck

      - name: Security Dependency Audit
        working-directory: ./frontend
        run: npm audit --audit-level=high

  frontend-ci:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    needs: [ lint-and-format ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Tests (Vitest)
        working-directory: ./frontend
        run: npm run test

      - name: Run Coverage Check (Vitest Threshold Gate)
        working-directory: ./frontend
        run: npm run coverage

      - name: Build Production Assets
        working-directory: ./frontend
        run: npm run build

  backend-ci:
    name: Backend Tests & Build (Standalone H2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: './backend/pom.xml'

      - name: Make Maven Wrapper Executable
        run: chmod +x ./backend/mvnw || true

      - name: Run Backend Tests (JUnit 5 & JaCoCo)
        working-directory: ./backend
        run: |
          mvn -B test -Dspring.profiles.active=test || {
            echo "=== SUREFIRE REPORTS ==="
            cat target/surefire-reports/*.txt 2>/dev/null || true
            exit 1
          }

      - name: Package Standalone Production JAR
        working-directory: ./backend
        run: mvn -B package -DskipTests

  python-ci:
    name: Python AI Demand Engine (pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'services/ai-demand-engine/requirements.lock'

      - name: Install Python Dependencies (Pinned Lockfile)
        working-directory: ./services/ai-demand-engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock

      - name: Run Python Pytest Suite
        working-directory: ./services/ai-demand-engine
        run: python -m pytest -v

  go-ci:
    name: Go Spatial Telemetry Service (go test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: 'services/telemetry-service/go.mod'

      - name: Run Go Unit Tests
        working-directory: ./services/telemetry-service
        run: go test -v -race ./...

      - name: Build Go Binary
        working-directory: ./services/telemetry-service
        run: CGO_ENABLED=0 go build -v -o telemetry-server main.go

  rust-ci:
    name: Rust Flash Sale Engine (cargo test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            services/flash-sale-engine/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('services/flash-sale-engine/Cargo.lock') }}

      - name: Run Rust Unit Tests
        working-directory: ./services/flash-sale-engine
        run: cargo test --verbose

      - name: Check Rust Compilation
        working-directory: ./services/flash-sale-engine
        run: cargo check --verbose

  docker-ci:
    name: Docker Stack Build Validation
    runs-on: ubuntu-latest
    needs: [ frontend-ci, backend-ci, python-ci, go-ci, rust-ci ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Fullstack Polyglot Docker Stack
        run: docker compose build --progress=plain
