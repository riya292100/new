name: QuickCart CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-format:
    name: Frontend Lint & Code Style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Verify Formatting (Prettier)
        working-directory: ./frontend
        run: npm run format:check

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

  frontend-ci:
    name: Frontend Tests & Coverage
    runs-on: ubuntu-latest
    needs: [ lint-and-format ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Security Vulnerability Audit
        working-directory: ./frontend
        run: npm audit --audit-level=critical

      - name: Run Vitest Suite with V8 Coverage
        working-directory: ./frontend
        run: npm run coverage

      - name: Build Production Assets
        working-directory: ./frontend
        run: npm run build

  backend-ci:
    name: Backend Tests & Build (Standalone H2)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Compile and Run Isolated JUnit 5 Tests
        working-directory: ./backend
        run: mvn clean test -Dspring.profiles.active=test

      - name: Package Standalone Production JAR
        working-directory: ./backend
        run: mvn package -DskipTests

  docker-ci:
    name: Docker Stack Build Validation
    runs-on: ubuntu-latest
    needs: [ frontend-ci, backend-ci ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Fullstack Docker Stack
        run: docker compose build
