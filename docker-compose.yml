version: '3.8'

services:
  # PostgreSQL Database Service
  postgres-db:
    image: postgres:16-alpine
    container_name: quickcart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: quickcart_db
      POSTGRES_USER: quickcart_user
      POSTGRES_PASSWORD: quickcart_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickcart_user -d quickcart_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quickcart-net

  # Redis Distributed Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: quickcart-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quickcart-net

  # Apache Kafka Event Broker (KRaft Mode)
  kafka:
    image: apache/kafka:3.7.0
    container_name: quickcart-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - quickcart-net

  # Spring Boot Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quickcart-backend
    restart: unless-stopped
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/quickcart_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-quickcart_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_strong_postgres_password}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ENABLED: "true"
      QUICKCART_APP_JWT_SECRET: ${QUICKCART_APP_JWT_SECRET:-CHANGE_ME_generate_with_openssl_rand_hex_32}
      QUICKCART_APP_PAYMENT_SECRET: ${QUICKCART_APP_PAYMENT_SECRET:-CHANGE_ME_webhook_secret}
      QUICKCART_DEMO_ADMIN_PASSWORD: ${QUICKCART_DEMO_ADMIN_PASSWORD:-CHANGE_ME_admin_password}
      QUICKCART_DEMO_DRIVER_PASSWORD: ${QUICKCART_DEMO_DRIVER_PASSWORD:-CHANGE_ME_driver_password}
      QUICKCART_DEMO_CUSTOMER_PASSWORD: ${QUICKCART_DEMO_CUSTOMER_PASSWORD:-CHANGE_ME_customer_password}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - quickcart-net

  # React / Vite Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quickcart-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "5173:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - quickcart-net

  # Python AI Demand Forecasting & Recommender Engine
  ai-demand-engine:
    build:
      context: ./services/ai-demand-engine
      dockerfile: Dockerfile
    container_name: quickcart-ai-demand-engine
    restart: unless-stopped
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8082/healthz\").read()' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - quickcart-net

  # Go Real-Time Rider Telemetry & Spatial Proximity Service
  telemetry-service:
    build:
      context: ./services/telemetry-service
      dockerfile: Dockerfile
    container_name: quickcart-telemetry-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8085/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - quickcart-net

  # Rust Flash Sale & Cryptographic Receipt Signing Engine
  flash-sale-engine:
    build:
      context: ./services/flash-sale-engine
      dockerfile: Dockerfile
    container_name: quickcart-flash-sale-engine
    restart: unless-stopped
    ports:
      - "8086:8086"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8086/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - quickcart-net


volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local

networks:
  quickcart-net:
    driver: bridge
