version: '3.8'

services:
  # PostgreSQL Database Service
  postgres-db:
    image: postgres:16-alpine
    container_name: quickcart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: quickcart_db
      POSTGRES_USER: quickcart_user
      POSTGRES_PASSWORD: quickcart_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickcart_user -d quickcart_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quickcart-net

  # Redis Distributed Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: quickcart-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quickcart-net

  # Spring Boot Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quickcart-backend
    restart: unless-stopped
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/quickcart_db
      SPRING_DATASOURCE_USERNAME: quickcart_user
      SPRING_DATASOURCE_PASSWORD: quickcart_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      QUICKCART_APP_JWT_SECRET: dGVzdFNlY3JldEtleUZvclF1aWNrQ2FydEFwcGxpY2F0aW9uTG9uZ0Vub3VnaFRvQmVTZWN1cmUyMDI2
      QUICKCART_APP_PAYMENT_SECRET: quickcart_mock_production_webhook_secret_key_2026
    ports:
      - "8080:8080"
    networks:
      - quickcart-net

  # React / Vite Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quickcart-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "5173:80"
    networks:
      - quickcart-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  quickcart-net:
    driver: bridge
