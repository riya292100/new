version: '3.8'

services:
  # PostgreSQL Database Service
  postgres-db:
    image: postgres:16-alpine
    container_name: quickcart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: quickcart_db
      POSTGRES_USER: quickcart_user
      POSTGRES_PASSWORD: quickcart_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickcart_user -d quickcart_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quickcart-net

  # Redis Distributed Cache & Session Store
  redis:
    image: redis:7-alpine
    container_name: quickcart-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - quickcart-net

  # Apache Kafka Event Broker (KRaft Mode)
  kafka:
    image: apache/kafka:3.7.0
    container_name: quickcart-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - quickcart-net

  # Spring Boot Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quickcart-backend
    restart: unless-stopped
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/quickcart_db
      SPRING_DATASOURCE_USERNAME: quickcart_user
      SPRING_DATASOURCE_PASSWORD: quickcart_password
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_ENABLED: "true"
      QUICKCART_APP_JWT_SECRET: dGVzdFNlY3JldEtleUZvclF1aWNrQ2FydEFwcGxpY2F0aW9uTG9uZ0Vub3VnaFRvQmVTZWN1cmUyMDI2
      QUICKCART_APP_PAYMENT_SECRET: quickcart_mock_production_webhook_secret_key_2026
    ports:
      - "8080:8080"
    networks:
      - quickcart-net

  # React / Vite Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quickcart-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "5173:80"
    networks:
      - quickcart-net

  # Python AI Demand Forecasting & Recommender Engine
  ai-demand-engine:
    build:
      context: ./services/ai-demand-engine
      dockerfile: Dockerfile
    container_name: quickcart-ai-demand-engine
    restart: unless-stopped
    ports:
      - "8082:8082"
    networks:
      - quickcart-net

  # Go Real-Time Rider Telemetry & Spatial Proximity Service
  telemetry-service:
    build:
      context: ./services/telemetry-service
      dockerfile: Dockerfile
    container_name: quickcart-telemetry-service
    restart: unless-stopped
    ports:
      - "8085:8085"
    networks:
      - quickcart-net

  # Rust Flash Sale & Cryptographic Receipt Signing Engine
  flash-sale-engine:
    build:
      context: ./services/flash-sale-engine
      dockerfile: Dockerfile
    container_name: quickcart-flash-sale-engine
    restart: unless-stopped
    ports:
      - "8086:8086"
    networks:
      - quickcart-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local

networks:
  quickcart-net:
    driver: bridge
